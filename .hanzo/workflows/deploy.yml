name: deploy

# gallery.hanzo.ai is a static export with no compute, served from the Sites
# plane at s3://hanzo-sites/hanzo/gallery.
#
#   npm run build -> out/  ->  site
#
# site is bin/site in hanzoai/ci, reached through its action:
# ensure-project, enqueue, presigned per-file upload, complete. It creates the
# project itself.
#
# The host is routed in hanzo/universe,
# charts/app/values/hanzo/static-sites.yaml.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # NOT ubuntu-latest. Every runner carrying this label is registered to
    # git.hanzo.ai, which is what reads .hanzo/workflows; a job asking for
    # ubuntu-latest is never assigned and cancels at the 24h timeout.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `prebuild` regenerates templates.json from templates-data.ts, and
      # `output: 'export'` renders every template page from it. A template that
      # no longer parses fails here rather than shipping a blank card.
      - run: npm run build

      # complete prunes whatever the build did not emit, so an empty export
      # would empty the live site.
      - name: Refuse an empty export
        run: |
          set -euo pipefail
          n=$(find out -type f | wc -l | tr -d ' ')
          [ "$n" -gt 50 ] || { echo "::error::out/ holds $n files — that is not a built gallery"; exit 1; }
          test -f out/index.html || { echo "::error::out/index.html is missing"; exit 1; }
          echo "export holds $n files"

      # ONE credential, and this file does not name it. The deploy key lives in
      # KMS and the action opens it there, so all that rides here is the client
      # identity. Passing secrets.HANZO_DEPLOY_TOKEN — one unreadable copy per
      # org — is the form the fleet moved off: a secret nobody can read back is
      # a secret nobody can tell has stopped resolving.
      #
      # The grant the 202 hands back is scoped to this site's prefix and expires,
      # so nothing here holds a bucket key. Do NOT add SITES_S3_* — that is the
      # standing shared credential the grant replaced, and it reaches every org's
      # site, not just this one.
      - name: Publish to the Sites plane
        uses: https://git.hanzo.ai/hanzoai/ci/.github/actions/site@v1
        with:
          slug: gallery
          dir: out
          jobs: '48'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
