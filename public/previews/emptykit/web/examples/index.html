<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emptykit · three.js gallery</title>
<!-- three.js from a CDN; with npm, drop this map and import 'three' through your bundler -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<style>
  :root { --bg: #F4F5F8; --card: #FFFFFF; --fg: #0F1115; --muted: #6B7180; --line: #0000000F; --chip: #EDEFF3; }
  body.dark { --bg: #0B0C10; --card: #14161C; --fg: #F2F4F8; --muted: #8C93A3; --line: #FFFFFF14; --chip: #1E2129; }
  body.bp.dark { --bg: #0B2E60; --card: #0E3A78; --line: #FFFFFF1F; --chip: #164A92; --muted: #A9C2E8; }
  body.bp:not(.dark) { --card: #F3F7FD; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); transition: background .25s, color .25s;
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 22px 32px 16px;
           border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
  h1 { font-size: 18px; margin: 0 16px 0 0; letter-spacing: -.01em; }
  .ctl { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; padding: 5px 11px;
                border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px #0000001A; }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .sw[aria-pressed=true] { border-color: var(--fg); }
  input[type=color] { width: 26px; height: 22px; border: 0; background: none; padding: 0; cursor: pointer; }
  label.tog { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 24px 32px 48px; }
  figure { margin: 0; background: var(--card); border-radius: 16px; box-shadow: 0 0 0 1px var(--line);
           padding: 14px 14px 12px; display: flex; flex-direction: column; align-items: center; }
  empty-state { width: 100%; max-width: 220px; }
  figcaption { font-size: 12.5px; color: var(--muted); align-self: stretch; display: flex; gap: 6px; }
  figcaption b { color: var(--fg); opacity: .5; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Emptykit · three.js</h1>
  <div class="ctl">Look <span class="seg" id="look"><button data-v="mono" aria-pressed="true">Mono</button><button data-v="line">Line</button><button data-v="blueprint">Blueprint</button></span></div>
  <div class="ctl">Theme <span class="seg" id="theme"><button data-v="light" aria-pressed="true">Light</button><button data-v="dark">Dark</button></span></div>
  <div class="ctl" id="accents">Accent</div>
  <label class="ctl tog"><input type="checkbox" id="glow"> Glow</label>
  <label class="ctl tog"><input type="checkbox" id="bold"> Bold</label>
  <div class="ctl">Motion <span class="seg" id="motion"><button data-v="tilt" aria-pressed="true">Tilt</button><button data-v="orbit">Orbit</button><button data-v="float">Float</button><button data-v="none">Still</button></span></div>
</header>
<main id="grid"></main>
<script type="module">
import { SUBJECTS, ACCENTS } from '../empty-state.js';
const q = new URLSearchParams(location.search);
const state = { look: q.get('look') || 'mono', theme: q.get('theme') || 'light', accent: q.get('accent') || 'indigo',
                glow: q.has('glow'), bold: q.has('bold'), motion: q.get('motion') || 'tilt' };
// a page of 48: 'tilt' (turn toward the pointer) only redraws while the pointer moves; 'orbit' turns all of them
const only = q.get('only') ? q.get('only').split(',') : null;
const grid = document.getElementById('grid');
for (const [n, slug, , title] of SUBJECTS) {
  if (only && !only.includes(slug)) continue;
  grid.insertAdjacentHTML('beforeend', `<figure><empty-state name="${slug}" phase="${(n * 0.37) % 9.6}"></empty-state>
    <figcaption><b>${String(n).padStart(2, '0')}</b>${title}</figcaption></figure>`);
}
const acc = document.getElementById('accents');
for (const [k, v] of Object.entries(ACCENTS)) {
  acc.insertAdjacentHTML('beforeend', `<button class="sw" data-v="${k}" title="${k}" style="background:${v.light[0]}"></button>`);
}
acc.insertAdjacentHTML('beforeend', '<input type="color" id="custom" value="#0EA5E9" title="Any colour">');
function apply() {
  document.body.classList.toggle('dark', state.theme === 'dark');
  document.body.classList.toggle('bp', state.look === 'blueprint');
  for (const el of document.querySelectorAll('empty-state')) {
    el.setAttribute('look', state.look);
    el.setAttribute('theme', state.theme);
    el.setAttribute('accent', state.accent);
    el.toggleAttribute('glow', state.glow);
    el.toggleAttribute('bold', state.bold);
    el.setAttribute('motion', state.motion);
  }
  for (const s of document.querySelectorAll('.seg button')) s.setAttribute('aria-pressed', String(state[s.parentNode.id] === s.dataset.v));
  for (const s of document.querySelectorAll('.sw')) s.setAttribute('aria-pressed', String(state.accent === s.dataset.v));
  for (const k of ['glow', 'bold']) document.getElementById(k).checked = state[k];
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('.seg button, .sw');
  if (!b) return;
  state[b.classList.contains('sw') ? 'accent' : b.parentNode.id] = b.dataset.v;
  apply();
});
document.getElementById('custom').addEventListener('input', (e) => { state.accent = e.target.value.toUpperCase(); apply(); });
for (const k of ['glow', 'bold']) document.getElementById(k).addEventListener('change', (e) => { state[k] = e.target.checked; apply(); });
apply();
</script>
</body>
</html>
